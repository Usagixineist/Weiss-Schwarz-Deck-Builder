## Settings file was created by plugin Weiss Schwarz Deck Sync v1.0.0
## Plugin GUID: ws.deckbuilder.decksync

[DeckSync]

## 总开关，关掉后不再同步卡组。
# Setting type: Boolean
# Default value: true
Enabled = true

## StreamingAssets\Decks 里新增或修改的卡组自动写进游戏卡组列表。
# Setting type: Boolean
# Default value: true
SyncToGame = true

## 游戏里新建或修改的卡组自动导出到 StreamingAssets\Decks，DeckBuilder 点刷新即可看到。
# Setting type: Boolean
# Default value: true
SyncFromGame = true

## 连游戏自带的预设/AI 卡组一起导出；游戏启动时会重建这些卡组，一般不需要。
# Setting type: Boolean
# Default value: false
IncludeDefaultDecks = false

## 只有正好 50 张的卡组才写进游戏；关掉后未完成的草稿也会同步。
# Setting type: Boolean
# Default value: true
RequireFullDeck = true

## 写入游戏前检查每一行卡号，遇到无法识别的行就跳过该卡组。
# Setting type: Boolean
# Default value: true
ValidateCardCodes = true

## 自动同步间隔（秒），最小 3 秒。
# Setting type: Int32
# Default value: 15
PollSeconds = 15

## 每次切换场景（例如回到主菜单）同步一次。
# Setting type: Boolean
# Default value: true
SyncOnSceneLoad = true

## 导入卡组后，如果游戏正开着卡组选择界面就立刻刷新列表。
# Setting type: Boolean
# Default value: true
RefreshDeckSelector = true

## 把没有变化的卡组也写进日志。
# Setting type: Boolean
# Default value: false
Verbose = false

## 完全忽略的卡组名，用逗号分隔。
# Setting type: String
# Default value: Placeholder
SkipDeckNames = Placeholder

## 手动同步一次的热键。
# Setting type: KeyboardShortcut
# Default value: F9
Hotkey = F9

## 同步基线文件名；相对路径相对于插件目录。
# Setting type: String
# Default value: deck-sync-state.txt
StateFile = deck-sync-state.txt

